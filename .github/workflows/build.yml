name: Build BetterJudgment Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with dotnet / csc
        shell: pwsh
        run: |
          dotnet build BetterJudgment.csproj -c Release
          if (!(Test-Path "bin/BetterJudgment.dll")) {
            ./build.ps1
          }
          New-Item -ItemType Directory -Path "release/BetterJudgment" -Force | Out-Null
          Copy-Item "bin/BetterJudgment.dll" "release/BetterJudgment/" -Force
          Copy-Item "Info.json" "release/BetterJudgment/" -Force
          Compress-Archive -Path "release/BetterJudgment" -DestinationPath "BetterJudgment.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterJudgment
          path: |
            BetterJudgment.zip
            bin/BetterJudgment.dll
            Info.json

      - name: Create GitHub Release (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BetterJudgment.zip
          generate_release_notes: true
