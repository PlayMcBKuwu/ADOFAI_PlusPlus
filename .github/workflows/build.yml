name: Build ADOFAI++ Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with dotnet / csc
        shell: pwsh
        run: |
          dotnet build ADOFAIPlusPlus.csproj -c Release
          if (!(Test-Path "bin/ADOFAIPlusPlus.dll")) {
            ./build.ps1
          }
          New-Item -ItemType Directory -Path "release/ADOFAIPlusPlus" -Force | Out-Null
          Copy-Item "bin/ADOFAIPlusPlus.dll" "release/ADOFAIPlusPlus/" -Force
          Copy-Item "Info.json" "release/ADOFAIPlusPlus/" -Force
          Compress-Archive -Path "release/ADOFAIPlusPlus" -DestinationPath "ADOFAIPlusPlus.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADOFAIPlusPlus
          path: |
            ADOFAIPlusPlus.zip
            bin/ADOFAIPlusPlus.dll
            Info.json

      - name: Publish Release (Rolling Latest on Push)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ADOFAI++ (Latest Build)"
          files: ADOFAIPlusPlus.zip
          generate_release_notes: true

      - name: Publish Release (Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ADOFAIPlusPlus.zip
          generate_release_notes: true
